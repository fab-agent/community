id = "community"
name = "Community"
version = "0.4.0"
description = "Put your teammates next to your agents: members, departments, tasks and direct messages inside Herdr."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "src/open.mjs", "--background"]

[[actions]]
id = "open"
title = "Community: open"
contexts = ["workspace"]
command = ["node", "src/open.mjs"]

[[actions]]
id = "pull"
title = "Community: paste last message into focused pane"
contexts = ["workspace"]
command = ["node", "src/pull.mjs"]

[[panes]]
id = "setup"
title = "Community setup"
placement = "popup"
width = "70%"
height = 14
command = ["node", "src/setup.mjs"]

[[panes]]
id = "chat"
title = "Community"
placement = "tab"
command = ["node", "src/chat.mjs"]

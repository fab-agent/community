name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Manifest parses
        run: python3 -c "import tomllib;d=tomllib.load(open('herdr-plugin.toml','rb'));assert d['id'] and d['version'] and d['min_herdr_version'];print(d['id'],d['version'])"
      - name: Tests
        run: npm test
